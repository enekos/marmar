name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed so the release job can create a GitHub Release.
permissions:
  contents: write

jobs:
  build:
    # marmar uses the macOS 26 Speech API (SpeechAnalyzer), so it MUST build on
    # a macOS 26 runner with Xcode 26. Adjust this label if GitHub's runner
    # naming changes.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version
          sw_vers

      - name: Build .app bundle
        run: ./build.sh release

      - name: Package (zip preserving bundle + signature)
        run: |
          cd .build
          ditto -c -k --keepParent marmar.app marmar.app.zip
          shasum -a 256 marmar.app.zip | tee marmar.app.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: marmar-app
          path: |
            .build/marmar.app.zip
            .build/marmar.app.zip.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/marmar.app.zip
            .build/marmar.app.zip.sha256
          generate_release_notes: true
